# Descarga los datos del Catastro (no accesibles desde el entorno de desarrollo)
# y los sube a la propia rama como data/catastro/<zona>.json.gz.
name: Datos del Catastro

on:
  workflow_dispatch:
    inputs:
      zone:
        description: Zona (tools/zones.py)
        default: eixample
  push:
    paths:
      - tools/catastro_fetch.py
      - tools/zones.py
      - .github/workflows/catastro.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests lxml pyproj
      - run: python3 tools/catastro_fetch.py ${{ inputs.zone || 'eixample' }}
      - name: Subir datos a la rama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catastro
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Datos del Catastro: ${{ inputs.zone || 'eixample' }}"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
